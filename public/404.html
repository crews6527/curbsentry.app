<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Page Not Found | CurbSentry</title>
    <meta name="description" content="The requested page could not be found. Return to the CurbSentry ALPR & Security Review Log." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        --deep: #16213e;
        --amber: #f59e0b;
        --bg: #f8fafc;
        --ink: #0f172a;
        --muted: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --ink: #f8fafc;
          --muted: #94a3b8;
        }
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 460px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      }
      .code {
        font-family: monospace;
        font-size: 3rem;
        font-weight: 800;
        color: var(--amber);
        margin: 0 0 0.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.875rem;
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      .btn {
        display: inline-block;
        background-color: var(--deep);
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The link you followed may be broken or the page may have been moved. Return to the CurbSentry security log to resume reviewing video clips.</p>
      <a href="/" class="btn">Return to CurbSentry Home</a>
    </main>
  </body>
</html>
